<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cerberus Vault</title><link rel="stylesheet" href="popup.css"></head>
<body><main><header><img src="icons/icon-128.png" alt=""><div><h1>Cerberus</h1><p>Vault Beta</p></div></header>
  <section id="import-view" hidden><h2>Configure seu cofre</h2><p>Crie um cofre novo ou importe um backup existente.</p><button id="open-manager-empty" class="primary" type="button">Criar ou importar cofre</button></section>
  <section id="unlock-view" hidden><h2>Cofre bloqueado</h2><form id="unlock-form"><input id="master-password" type="password" placeholder="Senha mestra" autocomplete="current-password" required><button class="primary" type="submit">Desbloquear</button></form><button id="open-manager-locked" class="link" type="button">Gerenciar ou importar backup</button></section>
  <section id="entries-view" hidden><div class="section-title"><div><h2 id="site-title">Credenciais</h2><p id="site-subtitle"></p></div><button id="lock" class="icon" title="Bloquear">Bloquear</button></div><div id="entries"></div><button id="open-manager" class="link" type="button">Gerenciar credenciais e backups</button></section>
<p id="message" role="status"></p><footer>Preenchimento somente após clique · bloqueio em 5 minutos</footer></main><script src="popup.js"></script></body></html>
